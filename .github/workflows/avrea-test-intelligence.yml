name: Avrea Test Intelligence

# Runs this project's own tests on Avrea runners. Gradle writes its test
# reports unasked, so nothing here asks for one. Manual only; not part of the
# upstream project.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: buildstack-dev-varjo
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Gradle tests
        run: ./gradlew test --no-daemon --continue
